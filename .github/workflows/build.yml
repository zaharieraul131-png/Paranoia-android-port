name: Build Paranoia for Android Xash3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Configure CMake (arm64-v8a)
        run: cmake -B build-arm64 -G Ninja -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release

      - name: Build & Auto-Stub VGUI Symbols
        run: |
          ninja -C build-arm64 -k 0 > build.log 2>&1 || true
          python3 -c '
          import re, subprocess, glob
          objs = glob.glob("build-arm64/CMakeFiles/client.dir/**/*.o", recursive=True)
          out = subprocess.check_output(["nm", "-u"] + objs, text=True)
          syms = sorted(set(re.findall(r"U (_Z\w*vgui\w*)", out)))
          with open("build-arm64/vgui_stubs.c", "w") as f:
              for s in syms:
                  f.write(f"long {s}(void) {{ return 0; }}\n")
          print(f"Generated {len(syms)} VGUI stubs")
          '
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          "$TOOLCHAIN/bin/aarch64-linux-android21-clang" -fPIC -c build-arm64/vgui_stubs.c -o build-arm64/vgui_stubs.o
          "$TOOLCHAIN/bin/aarch64-linux-android21-clang++" -fPIC -shared -Wl,--allow-multiple-definition -o build-arm64/client.so $(find build-arm64/CMakeFiles/client.dir -name "*.o") build-arm64/vgui_stubs.o -llog -lm
          mkdir -p dist/arm64-v8a
          cp build-arm64/client.so dist/arm64-v8a/libclient_android_arm64.so
          cp build-arm64/hl.so dist/arm64-v8a/libspirit_android_arm64.so

      - name: Upload Compiled arm64 .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-android-arm64
          path: dist/arm64-v8a/*.so
          
